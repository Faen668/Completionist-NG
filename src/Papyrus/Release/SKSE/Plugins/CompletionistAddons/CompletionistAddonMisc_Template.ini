;----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
;Each Compeltionist MCM page is capable of displaying 128 entries Maximum, this is a hard limit imposed by the Papyrus engine and cannot be bypassed or altered.
;This custom patch will allow you to track a maximum of 3 different 'Types', Items, Books and Locations.
;Each 'Type' has its own section and header on the mcm page and a header on the right showing the overall completion of that section.
;On each page you can have the following configurations per ini file.


; 1 Type: 126 entries
; 2 Types: 122 Entries.
; 3 Types: 118 Entries.

;Due to the existing Completionist MCM pages being quite full, I have decided not to allow patch additions to be added to existing pages as multiple patches adding
;to the same section could cause an overflow which in turn means Papyrus would shit itself and start stack dumping due to out of bounds errors when handling the arrays.
;This means that each one of these files will have to have its own MCM page which can be configured in this section of the file, all entries below will be added to this MCM page.

;----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
;DO NOT EDIT THIS SECTION
;----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
[Completionist Patch Data]
PatchType = Misc
ItemsPatchID = 747
BooksPatchID = 961
MapMaPatchID = 972

;----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
;EDIT FROM HERE DOWN
;----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

;Defines if this INI file should be loaded by Completionist.
Enabled = True

;The filename of the mod these entries are from. (Make sure spelling and extension (.esp, .esl, .esm) is correct as Completionist will do checks on this.)
PluginFileName = Some ESP File Name

;The name of the new MCM page that will be created for the entries in this file.
MCMPageName = Some MCM Page Name


;----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
;The [Type] variable defines what type of entry this is. (Item = 0, Book = 1, Map Marker = 2)
;The [FormID] variable defines the FormID of the entry. (Items & Books use the Base Object FormID, locations use the Object Reference FormID of the Map Marker.)
;The [Enabled] variable defines if that specific entry should be loaded by Completionist.
;Rename 'Example Entry' to something unique for this entry and change the type and formID, you can copy and paste the template to create new entries.
;----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
[Example Entry]
Type = 0
FormID = 0x000000
Enabled = True
