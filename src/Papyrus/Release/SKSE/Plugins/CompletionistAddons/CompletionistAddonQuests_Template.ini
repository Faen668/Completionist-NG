[Completionist Patch Data]

;Defines if this INI file should add quest tracking or misc tracking. This should never be changed under any circumstances.
PatchType = Quest

;Defines if this INI file should be loaded by Completionist.
Enabled = True

;Unique Patch ID set at runtime for locating data during play. 
;Do not manually edit this value. Completionist will set this automatically while parsing this file.
PatchID = 784


[Quest 1]

;Defines if this Quest should be loaded by Completionist
Enabled = True

;Defines the new MCM page that will be created for this quest if it does not exist already.
;An MCM page only needs to be created if the quest you are adding support for is not being added to existing mcm pages using the PatchIDOverride below.
RequiresCustomMCMPage = True
MCMPageName = Some MCM Page Name

;If this quest should be added to an existing page within Completionist, enter the ID of the page here, if not then leave at -1 to create the above page.
;If you want to add to an existing mcm page then see the included reference guide for the correct ID for the MCM page your adding the quest too.
PatchIDOverride = -1

;Each tracked quest requires a unique identifier, this is used in the DLL to store completion status as well as the MCM to retrive the correct info.
;The UUID can be anything you want, an example would be something along the lines of CC01_Quest01
;Please note that the UUID must be unique so using a combination of maybe your initials along with the quest / mod name may be better.
;Once the quest is completed this UUID will be saved and not changeable there after. Please make sure you have read and understand this.
UUID = MyPatchUUID01

;The name of the mod these quests are from. (Make sure spelling and extension (.esp, .esl, .esm) is correct as Completionist will do checks on this.)
PluginFileName = Some Plugin Name.esp

;This is the actual name of the mod that the quest comes from.
ModName = Some Mod Name

;This should be the editorID of the quest you want to track as per the creationkit or xedit.
EditorID = Some EditorID

;This is the actual name of the quest.
QuestName = Some Quest name

;If this is enabled, the text 'This Quest is provided by: MODNAME' will be appended onto the highlight text in the MCM.
AppendModName = True

;This is the information that will appear when highlighting the quest in the MCM.
;preferred format: Quest Giver: - Some Actor. \nRequirements: - Level 10+ and completion of 'Some Quest'.
HighlightText = Some Highlight Text

;This defines what type of quest this is and what section of the MCM page it appears in.
;Main = 0
;Side = 1
;Radiant = 2
QuestType = 0

;This defines how the quest is checked for completion.
;Standard = 0 	- To be used for quests that complete via normal method.
;Stage = 1 		- To be used for quests that are considered complete when they reach a specific stage.
;Global = 2		- To be used by Radiant quests to track the amount of times completed.
CompletionType = 0

;---------------------------------------------------------------------------------------------------------
;ONLY NEEDED IF CompletionType = 1 -----------------------------------------------------------------------
;---------------------------------------------------------------------------------------------------------

;This defines how completionist evaluates completion based on quest stages
;None = 0	- To be used if this quest does not complete via stage.
;Done = 1	- To be used if you want to check that a specific stage is done.
;Past = 2	- To be used if you want to check that the quest has advanced past a certain stage.
StageType = 0

;This defines the stage to check for.
Stage = 0

;Optional stage incase the quest is set up to complete at another stage.
OptionalStage = 0

;---------------------------------------------------------------------------------------------------------
;ONLY NEEDED IF CompletionType = 2 -----------------------------------------------------------------------
;---------------------------------------------------------------------------------------------------------

;This defines how many times this quest needs to be finished before the MCM treats the quest as complete. (Max = 9)
TimesRequired = 0

;This is the FormID of the quest, example 0x022528
BaseFormID = 0

;This defines the stage to check for.
RadiantStage = 0
