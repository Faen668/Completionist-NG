[Completionist Patch Data]
axPlt = 0

;Logging can be enabled to view log messages about this patches installation but please remember to disable it before shipping.
Log = False 

;Determines if this patch tracks vanilla items, this variable should not be modified unless you know what you are doing.
IsVanillaTracking = False

;Determines the display order of patches in the MCM, lower = higher in the list. if two patches share the same priority they will be sorted alphabetically.
Priority = 0

;Creates a new header for this patch, if other patches share the same header, they will be grouped under this header following the priority rules above.
Header = cTranslate_MCMHeader

;----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

;A Completionist Addon is by default comprised of 2 files, the .ini file provides all the data while the .txt file provides all the string translations for the addon.

;Creation of the localisation file can be skipped if you are utilising the 'OverrideLocalisationFileName' feature below which allows you to have one localisation file for 
;multiple .ini files.

;It is important to make sure you update both files so everything works and looks correct in game, you can rename this patch file to whatever you want but please make sure 
;it is unique enough to not conflict with any other potential patches and ensure that the translation file is renamed to be identical to this file with a .txt
;extension instead of .ini unless you are using the Override above.

;When finished your files should be put in the following folders.
;ini = SKSE\Plugins\CompletionistData\Addons
;txt = SKSE\Plugins\CompletionistData\Translations

;Optional - Delete if not required.
;The name of the file that will be used to hold the localised text for this .ini file, the translation file can support multiple .ini files but all keys must be unique.
;If no filename is provided then the mod will attempt to load lines from the default translation file as described above.
;The file should be placed in SKSE\Plugins\CompletionistData\Translations
OverrideLocalisationFileName = myLocalisedFile.txt

;----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

;Each Compeltionist MCM page is capable of displaying up to 128 entries including headers and empty spaces. 128 is a hard limit imposed by the Papyrus engine and cannot 
;be bypassed or altered for these purposes.

;This custom patch will allow you to add as many sections to the page as you like as long as each page does not exceed the table below.
;Each section has its own header on the mcm page and a header on the right showing the overall completion of that section.
;On each page you can have the following configurations per ini file.
;
; 1 Section: 126 entries. (+2 Headers = 128 Max)
; 2 Sections: 122 Entries. (+4 headers & 2 spaces = 128 Max)
; 3 Sections: 118 Entries. (+6 headers & 4 spaces = 128 Max)
; 4 Sections: 114 Entries. (+8 headers & 6 spaces = 128 Max)

; You can add as many section as you like, just -4 each time for the new total entries.

;Due to the existing Completionist MCM pages being quite full, I have decided not to allow patch additions to be added to native completionist pages as multiple patches adding
;to the same section could cause an overflow which in turn means Papyrus would shit itself and start stack dumping due to out of bounds errors when handling the arrays.
;This means that each one of these .ini files will have its own MCM page which can be configured below, all entries in this file will be added to this MCM page.

;Should this ini file be loaded by Completionist.
Enabled = True

;The filename of the main mod these entries are from. (Make sure spelling and extension (.esp, .esl, .esm) are correct as Completionist will do checks on this.)
;This ini file will not load if this plugin is not found in your load order. Specific esp names and install conditions can be provided on a per-formID basis below.
PluginFileName = Some File Name.esp

;Optional - Delete if not required.
;This is an optional variable that should be deleted if not required. This condition controls whether this ini file will be loaded depending on the existance of one or more mods.
;the file names should be prefixed with either '<!' for missing or '<&' for present.
;If you have multiple condition statements they should be separated with a comma ',' which represents an 'OR' statememnt.
;In the following example this ini file would only be installed if 'SomeModName1.esp' is MISSING from the load order [AND] 'SomeModName2.esm' is PRESENT in the load order or
;'SomeModName3.esp' is PRESENT in the load order [AND] 'SomeModName4.esm' is PRESENT in the laod order.
InstallCondition = <!SomeModName1.esp<&SomeModName2.esm,<&SomeModName3.esp<&SomeModName4.esm

;The localisation key for the name of the new MCM page that will be created for the entries in this file.
MCMPageName = cTranslate_MCMName

;If enabled, sections will have the page number prepended such as `1. Items:, 2. Locations:`
PrependPageNumber = True

;These localisation keys are very important and they tell Completionist not only the names of the pages but also how many pages there are.
;For this to work correctly create a new line for each internal page you add and call it PageName + [incrememnt]. PageName1 is mandatory for the first page.
PageName1 = cTranslate_PageName1
PageName2 = cTranslate_PageName2

;If you want to provide an install condition for a specific page, following the same logic as the above 'InstallCondition' you can do that by creating a new variable like so.
;This install condition should also be present in the page definition below.
PageName1_InstallCondition = <!SomeModName.esp,<&SomeModName2.esm
PageName2_InstallCondition = <!SomeModName.esp,<&SomeModName2.esm

;Adds a custom drop down menu to the mcm page for this ini file. this drop down will allow the user to show / hide entries based on which option they have selected.
;All options will be visible by default, to allow an entry to be hidden you must add the 'Visibility' flag to its formID as you can see in the section below.
DropDownMenu = True
DropDownMenu_Name = cTranslate_DropDownListName
DropDownMenu_Highlight = cTranslate_DropDownListHighlightText
DropDownMenu_Option_1 = cTranslate_DropDownListOption1
DropDownMenu_Option_2 = cTranslate_DropDownListOption2
DropDownMenu_Option_3 = cTranslate_DropDownListOption3

;----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

[Player Homes Example]
;Should this section be loaded by Completionist. (True/False)
Enabled = False

;Optional - Delete if not required.
;This is an optional variable that should be deleted if not required. This condition controls whether this section will be loaded depending on the existance of one or more mods.
;See above for details and usage.
InstallCondition = <!SomeModName1.esp<&SomeModName2.esm,<&SomeModName3.esp<&SomeModName4.esm

;This defines what page the section should load on. (min = 1, max = value of 'PageName{x}' above)
DisplayOnPage = 2

;The localisation keys for the left and right hand headers of this section in the mcm page.
SectionHeader_L = cTranslate_SectionHeader1L
SectionHeader_R = cTranslate_SectionHeader1R

;Optional - Delete if not required.
;Override the PluginFileName and install all formID's in this section from the provided mod. (Delete the line if not required)
InstallFrom = SomeModName1.esp

Type = 7

;This is a string of all the raw formID's for this section, formID's should always begin with `0x` and can be separated with a comma.
FormIDs = 0x000000,0x000001,0x000002

;Optional - Delete if not required.
;If a form has one or more variations you can track them along with the main form by adding the formIDs to a string using the base formID as the key.
;only the base formID should be present in the 'FormIDs' variable above, all variations should be created like so and use a comma to split them.
;These variations also support their own install conditions like below
0x000000 = 0x000001,0x000002,0x000003

;Optional - Delete if not required.
;If you want to provide an install condition for a specific form, following the same logic as the above 'InstallCondition' you can do that by creating a new variable like so.
0x000000_InstallCondition = <!SomeModName.esp,<&SomeModName2.esm

;Optional - Delete if not required.
;By default, only locations have highlight text in the MCM due to being able to interact with them and set a quest marker at the map marker location.
;you can add highlight text to your entires if you like by using the formID as a key with the text `_Highlight` appended too it
;Completionist will see this and add the text for you automatically.
0x000000_Highlight = cTranslateItemTextForBlaBla

;Optional - Delete if not required.
;If you want to provide a custom display name for a tracked entry you can do so by appending the text '_Displayname' to the end of the formID as a key like so.
;This will not touch or edit the entry in any way, just simply provide an alternate display name for the MCM and completion notifications.
0x000000_DisplayName = cTranslateItemNameForBlaBla

;Optional - Delete if not required.
;Adds the ability to show/hide this entry based on the mcm drop down menu selection (if enabled).
;The number here should be one less than the option as menus are 0 based, so DropDownMenu_Option_1 would be '0', DropDownMenu_Option_2 would be '1' etc...
;This entry will only be visible if the linked option is selected in the menu.
0x000000_Visibility = 1

;Rename this section header to something unique and do the same for every section you add.
[Page 2 - Something]

;Should this section be loaded by Completionist. (True/False)
Enabled = False

;Optional - Delete if not required.
;This is an optional variable that should be deleted if not required. This condition controls whether this section will be loaded depending on the existance of one or more mods.
;See above for details and usage.
InstallCondition = <!SomeModName1.esp<&SomeModName2.esm,<&SomeModName3.esp<&SomeModName4.esm

;This defines what page the section should load on. (min = 1, max = value of 'PageName{x}' above)
DisplayOnPage = 2

;The localisation keys for the left and right hand headers of this section in the mcm page.
SectionHeader_L = cTranslate_SectionHeader1L
SectionHeader_R = cTranslate_SectionHeader1R

;What type of entries are in this section? if you plan to add multiple types then simply create a new section for them following the rules above.
;Each section should house only 1 type of form.

;Type 0 = Items (Weapons, Armor, Misc Items, Potions, Liquor etc...)
;Type 1 = Books (Books, Notes, Spell Tomes, Skill Books etc...)
;Type 2 = Locations (Map markers) - must have base object formID of 0000010.
;Type 3 = Enchantments (Classified as 'Object Effect' in SSEEdit, this needs to be the playable base enchantment)
;Type 4 = Shouts.
;Type 5 = Quests (See below example for implementation)
;Type 6 = Fish (must be catchable by actually fishing)
;Type 7 = Player Home
;Type 8 = Pets
;Type 9 = Interactable Object (Object References that will complete when activating)
Type = 0

;Optional - Delete if not required.
;Override the PluginFileName and install all formID's in this section from the provided mod. (Delete the line if not required)
InstallFrom = SomeModName1.esp

;This is a string of all the raw formID's for this section, formID's should always begin with `0x` and can be separated with a comma.
FormIDs = 0x000000,0x000001,0x000002

;Optional - Delete if not required.
;If a form has one or more variations you can track them along with the main form by adding the formIDs to a string using the base formID as the key.
;only the base formID should be present in the 'FormIDs' variable above, all variations should be created like so and use a comma to split them.
;These variations also support their own install conditions like below
0x000000 = 0x000001,0x000002,0x000003

;Optional - Delete if not required.
;If you want to provide an install condition for a specific form, following the same logic as the above 'InstallCondition' you can do that by creating a new variable like so.
0x000000_InstallCondition = <!SomeModName.esp,<&SomeModName2.esm

;Optional - Delete if not required.
;By default, only locations have highlight text in the MCM due to being able to interact with them and set a quest marker at the map marker location.
;you can add highlight text to your entires if you like by using the formID as a key with the text `_Highlight` appended too it
;Completionist will see this and add the text for you automatically.
0x000000_Highlight = cTranslateItemTextForBlaBla

;Optional - Delete if not required.
;If you want to provide a custom display name for a tracked entry you can do so by appending the text '_Displayname' to the end of the formID as a key like so.
;This will not touch or edit the entry in any way, just simply provide an alternate display name for the MCM and completion notifications.
0x000000_DisplayName = cTranslateItemNameForBlaBla

;Optional - Delete if not required.
;Adds the ability to show/hide this entry based on the mcm drop down menu selection (if enabled).
;The number here should be one less than the option as menus are 0 based, so DropDownMenu_Option_1 would be '0', DropDownMenu_Option_2 would be '1' etc...
;This entry will only be visible if the linked option is selected in the menu.
0x000000_Visibility = 1

;----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

[Page 1 - Quests]
;Should this section be loaded by Completionist. (True/False)
Enabled = True

;This defines what page the section should load on. (min = 1, max = value of 'PageCount' above)
DisplayOnPage = 1

;Type 5 = Quests
Type = 5

;The localisation keys for the left and right hand headers of this section in the mcm page.
SectionHeader_L = MCMText_Section_Q_1
SectionHeader_R = MCMText_Section_Q_2

;----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

[Quest 1]

;This mandatory variable defines if this Quest should be loaded by Completionist
Enabled = True

;This is the page that the quest will show on, it should be one of the quest (type 5) sections defined above
DisplayOnPage = 1

;Optional - Delete if not required.
;This is an optional variable that should be deleted if not required. This condition controls whether this quest will be loaded depending on the existance of one or more mods.
;See above for details and usage.
InstallCondition = <!SomeModName1.esp<&SomeModName2.esm,<&SomeModName3.esp<&SomeModName4.esm

;Optional - Delete if not required.
;Adds the ability to show/hide this quest based on the mcm drop down menu selection (if enabled).
;The number here should relate to the option, so DropDownMenu_Option_1 would be '1', DropDownMenu_Option_2 would be '2' etc...
;This quest will only be visible if the linked option is selected in the menu.
Visibility = 1

;Each tracked quest requires a unique identifier, this is used in the DLL to store completion status as well as the MCM to retrive the correct info.
;The UUID can be anything you want, an example would be something along the lines of CC01_Quest01
;Please note that the UUID must be unique so using a combination of maybe your initials along with the quest / mod name may be better.
;Once the quest is completed this UUID will be saved and not changeable there after without loosing the completion status. Please make sure you have read and understand this.
UUID = MyAwesomeQuest01

;This mandatory variable defines the editorID of the quest you want to track as per the creationkit or xedit.
EditorID = SomeEditorID

;This mandatory localisation key defines the actual name of the quest.
QuestName = cTranslate_QuestName00

;This mandatory localisation key defines the information that will appear when highlighting the quest in the MCM.
;preferred format: Quest Giver: - Some Actor. \nRequirements: - Level 10+ and completion of 'Some Quest'.
HighlightText = cTranslate_QuestText00

;This mandatory variable defines what type of quest this is and what section of the MCM page it appears in.
;Main = 0
;Side = 1
;Radiant / Repeatable = 2
QuestType = 0

;This mandatory variable defines how the quest is checked for completion.
;Standard = 0 		- To be used for quests that complete via normal method.
;Stage = 1 			- To be used for quests that are considered complete when they reach or pass a specific stage.
;Conditional = 2	- To be used by Radiant / repeatable quests to track the amount of times completed.
CompletionType = 0

;---------------------------------------------------------------------------------------------------------
;ONLY NEEDED IF CompletionType = 1 (Safe to completely delete if not needed) -----------------------------
;---------------------------------------------------------------------------------------------------------

;This variable defines how completionist evaluates completion based on quest stages
;Stage Done = 1	- To be used if you want to check that a specific quest stage is done.
;Stage Past = 2	- To be used if you want to check that the quest has advanced past a certain stage. (useful for when quests have multiple stages that are considered complete)
StageType = 0

;This variable defines the stage to check for.
Stage = 0

;Optional stage incase the quest is set up to complete at another stage.
OptionalStage = 0

;---------------------------------------------------------------------------------------------------------
;ONLY NEEDED IF CompletionType = 2 (Safe to completely delete if not needed) -----------------------------
;---------------------------------------------------------------------------------------------------------

;Set this to true if this quest is considered complete by selling firewood, crops, mined ore or giving gold / alcohol to a specific npc.
isGenericFavorQuest = False

;This variable defines the type of the generic favor quest.
;Only used if 'isGenericFavorQuest' is true.
;Barter = 0 		- To be used for quests that complete via selling crops, mining ore, chopping wood etc...
;Beggar = 1 		- To be used for quests that are considered complete when giving gold to an npc.
;Gift / Drunk = 2	- To be used for quests that are considered complete when giving alcohol / gifts to an npc.
GenericFavorQuestType = 0

;This variable defines the formID of the 'FORMLIST' that holds records of all acceptable items.
;Only used if 'isGenericFavorQuest' is true and 'GenericFavorQuestType' = 2, example 0x022528
validItemsFormID = 0
validItemsFileName = Skyrim.esm

;This variable defines which plugin the npc base actor record is defined in.
;Only used if 'isGenericFavorQuest' is true.
PluginFileName = Skyrim.esm

;This variable defines how many times this quest needs to be completed before the MCM treats the quest as complete. (Max = 9)
TimesRequired = 0

;This variable defines the FormID of the quest or (base actor if 'isGenericFavorQuest' is true), example 0x022528
BaseFormID = 0

;This variable defines the quest stage to check for.
;unused for isGenericFavorQuest.
RadiantStage = 0