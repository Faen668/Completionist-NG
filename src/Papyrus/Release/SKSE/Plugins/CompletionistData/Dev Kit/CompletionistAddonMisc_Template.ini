[Completionist Patch Data]
PatchType = Misc
Analyse = False
axPlt = 0

;Logging can be enabled to view log messages about this patches installation but please remember to disable it before shipping.
Log = False 

;The name of the file that will be used to hold the localised text for this .ini file, the translation file can support multiple .ini files but all keys must be unique.
;If no filename is provided then the mod will attempt to load lines from the default translation file as described below.
OverrideLocalisationFileName = myLocalisedFile.txt

;----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

;A Completionist Addon is comprised of 2 files, the .ini file provides all the data while the .txt file provides all the string translations for the addon.

;It is important to make sure you update both files so everything works and looks correct in game, you can rename this patch file to whatever you want but please make sure 
;it is unique enough to not conflict with any other potential patches and ensure that the translation file is renamed to be identical to this file with a .txt
;extension instead of .ini unless you are using the Override above.

;When finished your files should be put in the following folders.
;ini = SKSE\Plugins\CompletionistData\Addons
;txt = SKSE\Plugins\CompletionistData\Translations

;----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

;Each Compeltionist MCM page is capable of displaying up to 128 entries including headers and empty spaces. 128 is a hard limit imposed by the Papyrus engine and cannot be bypassed or altered for these purposes.

;This custom patch will allow you to add as many sections to the page as you like as long as each page does not exceed the table below.
;Each section has its own header on the mcm page and a header on the right showing the overall completion of that section.
;On each page you can have the following configurations per ini file.
;
; 1 Section: 126 entries. (+2 Headers = 128 Max)
; 2 Sections: 122 Entries. (+4 headers & 2 spaces = 128 Max)
; 3 Sections: 118 Entries. (+6 headers & 4 spaces = 128 Max)
; 4 Sections: 114 Entries. (+8 headers & 6 spaces = 128 Max)

; You can add as many section as you like, just -4 each time for the new total entries.

;Due to the existing Completionist MCM pages being quite full, I have decided not to allow patch additions to be added to native completionist pages as multiple patches adding
;to the same section could cause an overflow which in turn means Papyrus would shit itself and start stack dumping due to out of bounds errors when handling the arrays.
;This means that each one of these .ini files will have its own MCM page which can be configured below, all entries in this file will be added to this MCM page.
;
;----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
;EDIT FROM HERE DOWN
;----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

;Should this ini file be loaded by Completionist.
Enabled = True

;The filename of the main mod these entries are from. (Make sure spelling and extension (.esp, .esl, .esm) are correct as Completionist will do checks on this.)
;This ini file will not load if this plugin is not found in your load order.
PluginFileName = Some File Name.esp

;The localisation key for the name of the new MCM page that will be created for the entries in this file.
MCMPageName = cTranslate_MCMName

;If you are creating more than one ini file resulting in 2 or more MCM pages, you can group them together in the MCM.
;This name can be anything you want as it is not seen by the user and does not need to be localised, it simply acts as a key.
UseMCMPageGrouping = False
MCMPageGroupName = None

;Support for multipage, An MCM page with a built in page manager and page directory. If MultiPage is enabled, define how many pages you would like.
MultiPage = True
MultiPage_PageCount = 2

;If enabled, sections will have the page number prepended such as `1. Items:, 2. Locations:`
MultiPage_PrependPageNumber = True

;The localisation keys for the variables to control how the pages will look when using the slider in the page directory.
;For this to work correctly create a new line and call it MultiPageName + PageNumber from above i.e MultiPageName7
MultiPageName1 = cTranslate_MultiPageName1
MultiPageName2 = cTranslate_MultiPageName2

;This is an optional variable that should be deleted if not required. This condition controls whether this ini file will be loaded depending on the existance of one or more mods.
;the file names should be prefixed with either '<!' for missing or '<&' for present.
;If you have multiple conditions they should be separated with a comma ','.
;In the following example this ini file would only be installed if 'SomeModName.esp' is MISSING from the load order [AND] 'SomeModName2.esm' is PRESENT in the load order.
InstallCondition = <!SomeModName.esp,<&SomeModName2.esm

;----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

;Rename this section header to something unique and do the same for every section you add.
[Page 2 - Something]

;Should this section be loaded by Completionist. (True/False)
Enabled = False

;This is an optional variable that should be deleted if not required. This condition controls whether this section will be loaded depending on the existance of one or more mods.
;the file names should be prefixed with either '<!' for missing or '<&' for present.
;If you have multiple conditions they should be separated with a comma ','.
;In the following example this ini file would only be installed if 'SomeModName.esp' is MISSING from the load order AND 'SomeModName2.esm' is PRESENT in the load order.
InstallCondition = <!SomeModName.esp,<&SomeModName2.esm

;If 'MultiPage' is enabled, this defines what page the section should load on. (min = 1, max = value of 'MultiPage_PageCount' above)
DisplayOnPage = 2

;The localisation keys for the left and right hand headers of this section in the mcm page.
SectionHeader_L = cTranslate_SectionHeader1L
SectionHeader_R = cTranslate_SectionHeader1R

;What type of entries are in this section? if you plan to add multiple types then simply create a new section for them following the rules above.
;Each section should house only 1 type of form.

;Type 0 = Items (Weapons, Armor, Misc Items, Potions, Liquor etc...)
;Type 1 = Books (Books, Notes, Spell Tomes, Skill Books etc...)
;Type 2 = Locations (Map markers) - must have base object formID of 0000010.
;Type 3 = Enchantments (Classified as 'Object Effect' in SSEEdit.)
;Type 4 = Shouts.
;Type 5 = Quests (See below example for implementation)
;Type 6 = Fish (must be catchable by actually fishing)
;Type 7 = Player Home
;Type 8 = Pets
;Type 9 = Interactable Object (Object References that will complete when activating)
Type = 0

;Optional variable that when set will override the PluginFileName and install all formID's in this section from the provided mod. (Set to 'None' or Delete the line if not required)
InstallFrom = None

;This is a string of all the raw formID's for this section, formID's should always begin with `0x` and can be separated with a comma.
FormIDs = 0x000000,0x000001,0x000002

;If a form has one or more variations you can track them along with the main form by adding the formIDs to a string using the base formID as the key.
;only the base formID should be present in the 'FormIDs' variable above, all variations should be created like so and use a comma to split them.
;These variations also support their own install conditions like below
0x000000 = 0x000001,0x000002,0x000003

;By default, only locations have highlight text in the MCM due to being able to interact with them and set a quest marker at the map marker location.
;you can add highlight text to your entires if you like by using the formID as a key with the text `_Highlight` appended too it
;Completionist will see this and add the text for you automatically.
0x000000_Highlight = cTranslateItemTextForBlaBla

;If you want to provide a custom display name for a tracked entry you can do so by appending the text '_Displayname' to the end of the formID as a key like so.
;This will not touch or edit the entry in any way, just simply provide an alternate display name for the MCM and completion notifications.
0x000000_DisplayName = cTranslateItemNameForBlaBla

;If you want to provide an install condition for a specific form, following the same logic as the above 'InstallCondition' you can do that by creating a new variable like so.
0x000000_InstallCondition = <!SomeModName.esp,<&SomeModName2.esm

;----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

;This is an example on how to add a quest page for your mod, it links with the other template file that holds the actual quest data, this section just defines the page
;and the ID of the quests to load into this page.

;Quest pages can not be mixed with the above types, each one of these quest sections should be its own page, however if you enable multipage you can add as many pages as you
;like to the same MCM.

[Page 1 - Quests]
;Should this section be loaded by Completionist. (True/False)
Enabled = True

;If 'MultiPage' is enabled, this defines what page the section should load on. (min = 1, max = value of 'MultiPage_PageCount' above)
DisplayOnPage = 1

;Type 5 = Quests
Type = 5

;The localisation keys for the left and right hand headers of this section in the mcm page.
SectionHeader_L = MCMText_Section_Q_1
SectionHeader_R = MCMText_Section_Q_2

;The QuestID registered to this section, any quests you add in your Quests ini file should also be set to this number if you want them to load on this page.
QuestID = 760

