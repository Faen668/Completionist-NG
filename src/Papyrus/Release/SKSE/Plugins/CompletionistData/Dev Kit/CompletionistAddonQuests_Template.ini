[Completionist Patch Data]
PatchType = Quest
Enabled = True
axPlt = 0

;Logging can be enabled to view log messages about this patches installation but please remember to disable it before shipping.
Log = False 

;This is an optional variable that should be deleted if not required. This condition controls whether this ini file will be loaded depending on the existance of another mod.
;the file name should be prefixed with either '<!' for missing or '<&' for installed.
;In the following example this quest would only be installed if 'SomeModName.esp' is MISSING from the load order.
InstallCondition = <!SomeModName.esp

;----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

;A Completionist Addon is comprised of 2 identically named files, the .ini file provides all the data while the .txt file provides all the string translations for the addon.

;It is important to make sure you update both files so everything works and looks correct in game, you can rename this patch file to whatever you want but please make sure 
;it is unique enough to not conflict with any other potential patches and ensure that the translation file is renamed to be identical to this file with a .txt
;extension instead of .ini.

;When finished your files should be put in the following folders.
;ini = SKSE\Plugins\CompletionistData\Addons
;txt = SKSE\Plugins\CompletionistData\Translations

;3 variables per quest require localised keys, those are:
;QuestName
;HighlightText
;MCMPageName

;----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
;EDIT FROM HERE DOWN
;----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

[Quest 1]

;This mandatory variable defines if this Quest should be loaded by Completionist
Enabled = True

;This mandatory variable defines what page to add this quest too. All quests are technically added to existing pages, if you want to add this quest to a native 
;quest page in completionist you can find the ID of the page In the 'Page ID Reference List' file. If you are adding a completely new page then this ID should 
;match the 'QuestID' variable from your misc template file. If you are not adding any quests to new pages and only adding to existing pages then you do not need to create 
;the other template unless you are adding misc tracking too. (Min = 500, Max = 2147483647)
QuestLink = -1

;This is an optional variable that should be deleted if not required. This condition controls whether the quest will be tracked depending on the existance of another mod.
;the file name should be prefixed with either '<!' for missing or '<&' for installed.
;In the following example this quest would only be installed if 'SomeModName.esp' is MISSING from the load order.
InstallCondition = <!SomeModName.esp

;Each tracked quest requires a unique identifier, this is used in the DLL to store completion status as well as the MCM to retrive the correct info.
;The UUID can be anything you want, an example would be something along the lines of CC01_Quest01
;Please note that the UUID must be unique so using a combination of maybe your initials along with the quest / mod name may be better.
;Once the quest is completed this UUID will be saved and not changeable there after. Please make sure you have read and understand this.
UUID = MyAwesomeQuest01

;This mandatory variable defines the editorID of the quest you want to track as per the creationkit or xedit.
EditorID = SomeEditorID

;This mandatory localisation key defines the name of the MCM this quest is being added too.
;If you are adding this quest to a native page you can find the MCM page name in the 'Page ID Reference List' file.
MCMPageName = cTranslate_MCMName

;This mandatory localisation key defines the actual name of the quest.
QuestName = cTranslate_QuestName00

;This mandatory localisation key defines the information that will appear when highlighting the quest in the MCM.
;preferred format: Quest Giver: - Some Actor. \nRequirements: - Level 10+ and completion of 'Some Quest'.
HighlightText = cTranslate_QuestText00

;This mandatory variable defines what type of quest this is and what section of the MCM page it appears in.
;Main = 0
;Side = 1
;Radiant = 2
QuestType = 0

;This mandatory variable defines how the quest is checked for completion.
;Standard = 0 	- To be used for quests that complete via normal method.
;Stage = 1 		- To be used for quests that are considered complete when they reach or pass a specific stage.
;Global = 2		- To be used by Radiant quests to track the amount of times completed.
CompletionType = 0

;---------------------------------------------------------------------------------------------------------
;ONLY NEEDED IF CompletionType = 1 (Safe to completely delete if not needed) -----------------------------
;---------------------------------------------------------------------------------------------------------

;This variable defines how completionist evaluates completion based on quest stages
;Stage Done = 1	- To be used if you want to check that a specific quest stage is done.
;Stage Past = 2	- To be used if you want to check that the quest has advanced past a certain stage. (useful for when quests have multiple stages that are considered complete)
StageType = 0

;This variable defines the stage to check for.
Stage = 0

;Optional stage incase the quest is set up to complete at another stage.
OptionalStage = 0

;---------------------------------------------------------------------------------------------------------
;ONLY NEEDED IF CompletionType = 2 (Safe to completely delete if not needed) -----------------------------
;---------------------------------------------------------------------------------------------------------

;This variable defines how many times this quest needs to be completed before the MCM treats the quest as complete. (Max = 9)
TimesRequired = 0

;This variable defines the FormID of the quest, example 0x022528
BaseFormID = 0

;This variable defines the stage to check for.
RadiantStage = 0
