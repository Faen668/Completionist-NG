;==============================================================================
; COMPLETIONIST ADDON TEMPLATE
;==============================================================================
; This file shows every setting an addon can use, with an example of each
; Type. "Completionist Addon Guide.md" explains everything in more detail.
;
; HOW TO USE THIS TEMPLATE
;  1. Copy this file and CompletionistAddon_Template.txt.
;  2. Give both copies the same new name, e.g. AuthorName_ModName.ini and
;     AuthorName_ModName.txt. Pick a name no other addon is likely to use.
;  3. Change PluginFileName below to your mod's plugin.
;  4. Delete the example sections you don't need and fill in the rest.
;  5. Put the files here:
;       .ini  ->  Data\SKSE\Plugins\CompletionistData\Addons\
;       .txt  ->  Data\SKSE\Plugins\CompletionistData\Translations\
;  6. Restart the game. Addons are only read when the game starts.
;
; THE TWO FILES
;  This .ini says WHAT to track. It never holds text the player reads.
;  Where text is needed, it holds a KEY such as cTranslate_PageName1.
;  The .txt file turns each key into the text the player sees.
;
; RULES FOR THIS FILE
;  - A comment is a line that starts with ;
;    Comments must be on their own line. "Type = 0 ; items" breaks the value.
;    The one exception: inside a FormIDs list, a note may follow the comma.
;  - Every section needs "Enabled = true", or it is skipped.
;  - Every section needs its own name. Sections with the same name are merged.
;  - Setting names don't care about upper or lower case.
;  - True/false can also be written yes/no, on/off or 1/0.
;
; "Optional" below means you can delete the line if you don't need it.
; Lines like ";Setting = value" are optional examples that are switched off.
; Remove the ; at the start to use one.
;==============================================================================


[Completionist Patch Data]

; Load this addon? Leaving it out counts as false.
Enabled = true

; The plugin most of your FormIDs come from, with its extension
; (.esp, .esm or .esl). If it isn't in the load order, the whole addon is
; skipped. FormIDs from other plugins are written 0x123456*Other.esp.
PluginFileName = MyMod.esp

; Optional. Only load the addon when other plugins are, or aren't, installed.
;   <&Plugin.esp   = is installed
;   <!Plugin.esp   = is NOT installed
; Several in a row must ALL be true. A comma separates groups, and ANY ONE
; group being true is enough. This example loads the addon when
; SomeMod1 is missing AND SomeMod2 is there, OR when SomeMod3 AND SomeMod4
; are both there.
;InstallCondition = <!SomeMod1.esp<&SomeMod2.esm,<&SomeMod3.esp<&SomeMod4.esm

; Key for the name of this addon's page in the Completionist window.
MCMPageName = cTranslate_MCMName

; Keys for the tabs on your page. Number them 1, 2, 3 with no gaps:
; Completionist stops at the first missing number. PageName1 is required.
; With only one tab, the page shows no tab bar.
PageName1 = cTranslate_PageName1
PageName2 = cTranslate_PageName2

; Optional. Only show a tab when a condition is met (same format as
; InstallCondition above). Every list on that tab is hidden otherwise.
;PageName2_InstallCondition = <&SomeMod2.esm

; Optional. Where your page sits in the list of pages. Lower comes first.
; Pages with the same priority are sorted by name. Default 0.
Priority = 0

; Optional. Key for a heading in the list of pages. Addons whose heading
; text is the same are listed together under it. Without one, the page goes
; under "Mod Added Patches".
Header = cTranslate_Header

; Optional. true ONLY for addons that track the base game or Creation Club
; content: their pages are listed first, under "Vanilla Tracking".
; Leave false for mods.
IsVanillaTracking = false

; Optional. How the entries in each list are ordered.
;   0 = A to Z (default)
;   1 = A to Z, ignoring a leading "The", "A" or "An"
;   2 = the order you wrote them in the FormIDs list
SortMode = 0

; Optional. The translation file to use instead of <this file's name>.txt.
; Several .ini files can share one .txt this way, as long as their keys are
; all different.
;OverrideLocalisationFileName = MyMod_Shared.txt

; Optional. true writes what happened to each entry to Completionist.log
; (Documents\My Games\Skyrim Special Edition\SKSE). Use it while you make
; the addon and set it back to false before you release it.
Log = false

; Optional. A drop-down at the top of the page that filters the entries.
; Number the options 1, 2, 3 with no gaps. Tie an entry to an option with
; 0x123456_Visibility = 2 (or a quest with Visibility = 2): it then only
; shows while option 2 is picked. Entries without Visibility always show.
DropDownMenu = true
DropDownMenu_Name = cTranslate_Filter_Name
DropDownMenu_Highlight = cTranslate_Filter_Hint
DropDownMenu_Option_1 = cTranslate_Filter_Option1
DropDownMenu_Option_2 = cTranslate_Filter_Option2


;==============================================================================
; SECTIONS
;==============================================================================
; Every section below is one list, with a heading, on one of your tabs.
; These settings work in every section:
;
;   Enabled          = true to load the section.                     Required
;   Type             = what the list holds, 0 to 9 (see each one).   Required
;   DisplayOnPage    = which tab: 1 for PageName1, 2 for PageName2.  Required
;                      It must be a tab you named above.
;   SectionHeader_L  = key for the list's heading.                   Required
;   SectionHeader_R  = key for the right-hand heading in older       Optional
;                      versions of Completionist. Not shown any more.
;   FormIDs          = the things to track (not for Type 5).         Required
;   InstallFrom      = the plugin these FormIDs come from, if it     Optional
;                      isn't PluginFileName.
;   InstallCondition = only load this section when a condition is    Optional
;                      met (same format as above).
;
; WRITING FORMIDS
;   Leave out the load order. In xEdit, FE000807 (a light plugin) is
;   written 0x000807, and 0A01ABCD (a normal plugin) is written 0x01ABCD.
;   End every FormID with a comma, including the last one.
;
;   On one line:   FormIDs = 0x000801,0x000802,
;   As a list:     FormIDs = <<<LIST       starts the list
;                  0x000801, ; a note      a note may follow the comma
;                  LIST                    ends the list
;   Keep "0x" out of the notes: Completionist reads any 0x as a FormID.
;
;   0x000801*Other.esp,          this FormID comes from Other.esp
;   0x000801<!Other.esp,         only if Other.esp is NOT installed
;   0x000801<&Other.esp,         only if Other.esp IS installed
;   0x000801*A.esp<&B.esp,       from A.esp, only if B.esp is installed
;
; SETTINGS FOR ONE ENTRY
;   Put these after the list, in the same section. Start each one with the
;   FormID written EXACTLY as in the list (0x807 and 0x000807 don't match).
;
;   0x000801 = 0x000802,0x000803,       Variations: other FormIDs that count
;                                       as this entry (Types 0, 1, 6, 9)
;   0x000801_DisplayName = key          A name to show instead of the
;                                       record's own name
;   0x000801_Highlight = key            A hint shown under the entry
;   0x000801_Visibility = 1             Show only for drop-down option 1
;   0x000801_InstallCondition = <&X.esp Only load this entry when a
;                                       condition is met
;   _PickupEnabled, _Type, _Stage and _OptionalStage: see Types 6, 7 and 8.
;
;   For an entry written 0x000801*Other.esp you can also use the whole thing,
;   e.g. 0x000801*Other.esp_DisplayName. You only need that when one list has
;   the same FormID from two plugins.
;==============================================================================


;------------------------------------------------------------------------------
; TYPE 0 - ITEMS
; List:      the item records: weapons, armour, clothing, jewellery, ammo,
;            potions, food, ingredients, keys, misc items, soul gems.
; Completed: when the item is added to the player's inventory.
; Items with no name are skipped. Items Completionist already tracks itself
; are skipped too, so you don't need to remove them.
;------------------------------------------------------------------------------
[Weapons]
Enabled = true
Type = 0
DisplayOnPage = 1
SectionHeader_L = cTranslate_Header_Weapons
SectionHeader_R = cTranslate_Header_Found

FormIDs = <<<LIST
0x000801, ; Frostbite Spear
0x000805, ; Bloodchill Bow
0x000806*Other.esp, ; Rimefang Dagger
0x000807<!OtherPatch.esp, ; Old Bow (removed by OtherPatch.esp)
LIST

; The spear has two levelled copies. Finding any of the three completes it.
0x000801 = 0x000802,0x000803,

; A hint under the bow, and a different name for the dagger.
0x000805_Highlight = cTranslate_Hint_BloodchillBow
0x000806*Other.esp_DisplayName = cTranslate_Name_RimefangDagger

; Only show the bow while drop-down option 2 is picked.
0x000805_Visibility = 2

; Only track the spear when SomeMod2.esm is installed.
;0x000801_InstallCondition = <&SomeMod2.esm


;------------------------------------------------------------------------------
; TYPE 1 - BOOKS
; List:      book records: books, notes, journals, spell tomes, skill books.
; Completed: when the player reads it. (Also when picked up, if the player
;            turned that on in Completionist's settings.)
; If the player limits books to spell tomes and skill books, other books
; aren't loaded.
;------------------------------------------------------------------------------
[Books]
Enabled = true
Type = 1
DisplayOnPage = 1
SectionHeader_L = cTranslate_Header_Books
SectionHeader_R = cTranslate_Header_Read

FormIDs = <<<LIST
0x000810, ; The Frozen Vault
0x000811, ; Spell Tome: Ice Lance
LIST

0x000810_Highlight = cTranslate_Hint_FrozenVault


;------------------------------------------------------------------------------
; TYPE 2 - LOCATIONS
; List:      the map marker REFERENCE placed in the world (its base object is
;            MapMarker, 00000010). Use the reference's own FormID.
; Completed: when it's discovered: it shows on the map and the player can
;            fast travel to it.
; The entry uses the map marker's name. Avoid _DisplayName here: the place
; would only be marked found the next time the map is opened.
;------------------------------------------------------------------------------
[Locations]
Enabled = true
Type = 2
DisplayOnPage = 1
SectionHeader_L = cTranslate_Header_Locations
SectionHeader_R = cTranslate_Header_Discovered

FormIDs = <<<LIST
0x000820, ; Bloodchill Manor
0x000821, ; Frostmoon Crag
LIST

0x000821_Highlight = cTranslate_Hint_FrostmoonCrag


;------------------------------------------------------------------------------
; TYPE 3 - ENCHANTMENTS
; List:      the playable base enchantment ("Object Effect", ENCH, in xEdit).
; Completed: when the player learns it by disenchanting.
;------------------------------------------------------------------------------
[Enchantments]
Enabled = true
Type = 3
DisplayOnPage = 1
SectionHeader_L = cTranslate_Header_Enchantments
SectionHeader_R = cTranslate_Header_Learned
FormIDs = 0x000830,0x000831,


;------------------------------------------------------------------------------
; TYPE 4 - SHOUTS
; List:      the shout record (SHOU).
; Completed: when every word is learned. Each word learned shows on the entry.
;------------------------------------------------------------------------------
[Shouts]
Enabled = true
Type = 4
DisplayOnPage = 1
SectionHeader_L = cTranslate_Header_Shouts
SectionHeader_R = cTranslate_Header_Learned
FormIDs = 0x000840,


;------------------------------------------------------------------------------
; TYPE 5 - QUESTS
; This section has NO FormIDs. It marks the tab where your quests appear.
; Each quest is its own section further down. Quests are grouped into Main,
; Side, Radiant and Completed, like Completionist's own quest pages.
;------------------------------------------------------------------------------
[Quest list]
Enabled = true
Type = 5
DisplayOnPage = 2
SectionHeader_L = cTranslate_Header_Quests
SectionHeader_R = cTranslate_Header_Completed


;------------------------------------------------------------------------------
; TYPE 6 - FISH
; List:      the fish item that goes into the player's inventory.
; Completed: when the player catches it with the Fishing Creation.
; _PickupEnabled = true also completes it when it's picked up any other way.
; Use that for fish that are found rather than caught. Default false.
;------------------------------------------------------------------------------
[Fish]
Enabled = true
Type = 6
DisplayOnPage = 1
SectionHeader_L = cTranslate_Header_Fish
SectionHeader_R = cTranslate_Header_Caught

FormIDs = <<<LIST
0x000850, ; Frost Pike
0x000851, ; Glacier Crab
LIST

0x000850_Highlight = cTranslate_Hint_FrostPike
0x000851_PickupEnabled = true


;------------------------------------------------------------------------------
; TYPE 7 - PLAYER HOMES
; Each home is completed one of two ways, set with _Type:
;   _Type = 0   List the QUEST that hands over the house. Completed when the
;               quest reaches the stage in _Stage.
;   _Type = 1   List the house's KEY. Completed when the key is added to the
;               player's inventory.
; _OptionalStage is read but not used yet. Set it to 0.
; Give each home a _DisplayName: a quest's or key's name rarely reads well.
;------------------------------------------------------------------------------
[Homes]
Enabled = true
Type = 7
DisplayOnPage = 1
SectionHeader_L = cTranslate_Header_Homes
SectionHeader_R = cTranslate_Header_Owned

FormIDs = <<<LIST
0x000860, ; quest MyModBuyManorQuest
0x000861, ; Frostmoon Cabin Key
LIST

0x000860_Type = 0
0x000860_Stage = 200
0x000860_OptionalStage = 0
0x000860_DisplayName = cTranslate_Home_Manor
0x000860_Highlight = cTranslate_Hint_Manor

0x000861_Type = 1
0x000861_DisplayName = cTranslate_Home_Cabin


;------------------------------------------------------------------------------
; TYPE 8 - PETS
; Each pet is completed one of two ways, set with _Type:
;   _Type = 0   List the pet's ACTOR BASE (NPC_). Completed when the player
;               activates (talks to) the pet.
;   _Type = 1   List the QUEST that gives the pet. Completed when the quest
;               reaches the stage in _Stage.
;------------------------------------------------------------------------------
[Pets]
Enabled = true
Type = 8
DisplayOnPage = 1
SectionHeader_L = cTranslate_Header_Pets
SectionHeader_R = cTranslate_Header_Tamed

FormIDs = <<<LIST
0x000870, ; Snow Fox
0x000871, ; quest MyModAdoptWolfQuest
LIST

0x000870_Type = 0
0x000870_Highlight = cTranslate_Hint_SnowFox

0x000871_Type = 1
0x000871_Stage = 50
0x000871_DisplayName = cTranslate_Pet_Wolf


;------------------------------------------------------------------------------
; TYPE 9 - INTERACTABLE OBJECTS
; List:      a placed object in the world (a REFR): a shrine, lever, statue,
;            fishing spot. Use the reference's own FormID, not its base's.
; Completed: when the player activates it.
; The reference doesn't need to be persistent: Completionist reads the
; others from the plugin itself. No extra "make persistent" plugin needed.
; Many objects share a name, so give each one a _DisplayName.
; Fishing spots placed from the Fishing Creation's spots get a "Find the
; fishing spot in ..." button by themselves. Nothing to set.
;------------------------------------------------------------------------------
[Shrines]
Enabled = true
Type = 9
DisplayOnPage = 1
SectionHeader_L = cTranslate_Header_Shrines
SectionHeader_R = cTranslate_Header_Used

FormIDs = <<<LIST
0x000880, ; Shrine of Talos
0x000881, ; Fishing Spot
LIST

0x000880_DisplayName = cTranslate_Shrine_Crag
0x000880_Highlight = cTranslate_Hint_ShrineCrag


;==============================================================================
; QUESTS
;==============================================================================
; A section with an EditorID is a quest. It needs no Type, but it needs a
; Type 5 section on the same tab (see "Quest list" above).
; Quests Completionist already tracks itself are skipped.
;
; Settings for every quest:
;   Enabled          = true to load this quest.                      Required
;   DisplayOnPage    = the tab with your Type 5 section.             Required
;   EditorID         = the quest's Editor ID from xEdit or the CK.   Required
;   UUID             = a name for this quest no other addon uses.    Required
;                      Saves remember completed quests by it, so
;                      NEVER change it after you release the addon.
;   QuestName        = key for the quest's name.                     Required
;   HighlightText    = key for the hint, e.g. quest giver and level. Required
;   QuestType        = 0 Main, 1 Side, 2 Radiant / repeatable.       Required
;   CompletionType   = 0 the normal way, 1 at a quest stage,         Required
;                      2 repeatable (counted). See the examples.
;   InstallCondition = only load when a condition is met.           Optional
;   Visibility       = show only for this drop-down option (1, 2..). Optional
;==============================================================================

; CompletionType = 0: done when the game marks the quest completed or failed.
; Most quests use this.
[Quest - The Frozen Vault]
Enabled = true
DisplayOnPage = 2
UUID = MyName_MyMod_Quest01
EditorID = MyModVaultQuest
QuestName = cTranslate_QuestName01
HighlightText = cTranslate_QuestText01
QuestType = 0
CompletionType = 0

; CompletionType = 1: done at a quest stage.
;   StageType     = 1  done once the quest has gone PAST Stage
;                   2  done once Stage itself is DONE
;   Stage         = the stage to check
;   OptionalStage = a second stage that also counts (two endings), or 0
[Quest - Ending Either Way]
Enabled = true
DisplayOnPage = 2
UUID = MyName_MyMod_Quest02
EditorID = MyModChoiceQuest
QuestName = cTranslate_QuestName02
HighlightText = cTranslate_QuestText02
QuestType = 1
CompletionType = 1
StageType = 2
Stage = 200
OptionalStage = 210
Visibility = 1

; CompletionType = 2: a repeatable quest, done after it's finished a number
; of times.
;   RadiantStage  = each time the quest reaches this stage, it counts once
;   TimesRequired = 1 to 9. Or let the player decide, using one of their
;                   radiant settings: 10 fishing, 11 favours, 12 bounties,
;                   13 College, 14 Companions, 15 Dark Brotherhood,
;                   16 Dawnguard, 17 Thieves Guild, 18 Legacy of the
;                   Dragonborn, 19 Vigilants, 20 Blades.
[Quest - Wolf Hunt]
Enabled = true
DisplayOnPage = 2
UUID = MyName_MyMod_Quest03
EditorID = MyModRadiantHunt
QuestName = cTranslate_QuestName03
HighlightText = cTranslate_QuestText03
QuestType = 2
CompletionType = 2
RadiantStage = 100
TimesRequired = 3

; FAVOUR QUESTS: CompletionType = 2 favours with no stage to watch.
; Completionist watches the NPC instead of the quest.
;   isGenericFavorQuest   = true
;   GenericFavorQuestType = 0  selling to the NPC (crops, ore, firewood)
;                           1  giving the NPC gold (beggars)
;                           2  giving the NPC an item from a list (drinks)
;   BaseFormID            = the NPC's actor base FormID (no load order)
;   PluginFileName        = the plugin that NPC comes from
;   validItemsFormID      = type 2 only: the form list (FLST) of items
;   validItemsFileName    = type 2 only: the plugin that form list comes from
; Leave BaseFormID out of quests that aren't favour quests.
[Quest - A Drink for Old Hrolf]
Enabled = true
DisplayOnPage = 2
UUID = MyName_MyMod_Quest04
EditorID = MyModFavorDrink
QuestName = cTranslate_QuestName04
HighlightText = cTranslate_QuestText04
QuestType = 2
CompletionType = 2
TimesRequired = 1
isGenericFavorQuest = true
GenericFavorQuestType = 2
BaseFormID = 0x000890
PluginFileName = MyMod.esp
validItemsFormID = 0x000891
validItemsFileName = MyMod.esp
